app = "relay"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

# Fly has no per-process env, so the role comes in as a Spring command-line
# argument, which overrides application.yml.
[processes]
  api = "java -jar app.jar --relay.worker.enabled=false"
  worker = "java -jar app.jar --relay.worker.enabled=true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["api"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
