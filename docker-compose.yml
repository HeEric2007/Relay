services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/relay
      DB_USER: relay
      DB_PASSWORD: relay
      WORKER_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/relay
      DB_USER: relay
      DB_PASSWORD: relay
      WORKER_ENABLED: "true"
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
